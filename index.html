// ── SVG helpers ──
const MK_SHAPES = {
  vierkant:   { svg:(c)=>`<rect x="60" y="30" width="120" height="120" fill="${c}" fill-opacity="0.22" stroke="${c}" stroke-width="3" rx="2"/>`, naam:'vierkant', zijden:4, hoeken:4, gelijkZijden:true,  rechteHoeken:true  },
  rechthoek:  { svg:(c)=>`<rect x="20" y="60" width="200" height="100" fill="${c}" fill-opacity="0.22" stroke="${c}" stroke-width="3" rx="2"/>`, naam:'rechthoek', zijden:4, hoeken:4, gelijkZijden:false, rechteHoeken:true  },
  driehoek:   { svg:(c)=>`<polygon points="120,20 215,190 25,190" fill="${c}" fill-opacity="0.22" stroke="${c}" stroke-width="3"/>`, naam:'driehoek', zijden:3, hoeken:3, gelijkZijden:false, rechteHoeken:false },
  cirkel:     { svg:(c)=>`<circle cx="120" cy="110" r="88" fill="${c}" fill-opacity="0.22" stroke="${c}" stroke-width="3"/>`, naam:'cirkel', zijden:0, hoeken:0, gelijkZijden:false, rechteHoeken:false },
  ruit:       { svg:(c)=>`<polygon points="120,15 215,110 120,205 25,110" fill="${c}" fill-opacity="0.22" stroke="${c}" stroke-width="3"/>`, naam:'ruit', zijden:4, hoeken:4, gelijkZijden:true,  rechteHoeken:false },
  trapezium:  { svg:(c)=>`<polygon points="50,185 190,185 160,55 80,55" fill="${c}" fill-opacity="0.22" stroke="${c}" stroke-width="3"/>`, naam:'trapezium', zijden:4, hoeken:4, gelijkZijden:false, rechteHoeken:false },
  vijfhoek:   { svg:(c)=>`<polygon points="120,15 210,75 178,185 62,185 30,75" fill="${c}" fill-opacity="0.22" stroke="${c}" stroke-width="3"/>`, naam:'vijfhoek', zijden:5, hoeken:5, gelijkZijden:true,  rechteHoeken:false },
  zeshoek:    { svg:(c)=>`<polygon points="120,15 205,62 205,158 120,205 35,158 35,62" fill="${c}" fill-opacity="0.22" stroke="${c}" stroke-width="3"/>`, naam:'zeshoek', zijden:6, hoeken:6, gelijkZijden:true,  rechteHoeken:false },
};
const MK_KEYS = Object.keys(MK_SHAPES);

function mkSVG(key, extra=''){
  const col = 'var(--accent)';
  return `<svg viewBox="0 0 240 220" width="150" height="130" style="display:block;margin:0 auto 8px;">${MK_SHAPES[key].svg(col)}${extra}</svg>`;
}

function mkMCHTML(opts, correct){
  return `<div class="mk-mc-grid">${opts.map((o,i)=>`<button class="mc-option" onclick="checkMkMC(this)" data-val="${o}"><span class="mc-letter">${'ABCD'[i]}</span><span class="mc-text">${o}</span></button>`).join('')}</div>`;
}

function shuffleArr(a){return [...a].sort(()=>Math.random()-0.5);}
function rnd(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

// Anti-herhaling wachtrij
function nextFromQueue(pool){
  if(mkQueue.length===0) mkQueue=shuffleArr([...pool]);
  return mkQueue.shift();
}

// ── VRAAG GENERATIE ──
function loadMkQ(){
  mkAnswered=false;
  removeStickyNext();
  mkTotal++;
  const card=document.getElementById('mk-card');if(!card)return;

  let q;
  if(mkOefTab==='vormen')         q=genVormenQ();
  else if(mkOefTab==='eigenschappen') q=genEigenschappenQ();
  else if(mkOefTab==='berekenen') q=genBerekeningQ();
  else                            q=genHoekenQ();

  mkCurrentQ=q;
  card.innerHTML=`
    <div class="t-quiz-meta"><span class="t-prog">Vraag ${mkTotal}</span></div>
    <div style="text-align:center;margin-bottom:4px;">${q.svg||''}</div>
    <div class="t-question" style="font-size:15px;font-weight:600;margin-bottom:14px;">${q.vraag}</div>
    <div id="mk-input-area">${q.inputHTML}</div>
    <div id="mk-feedback"></div>`;

  if(q.type==='type'){
    const inp=document.getElementById('mk-type-input');
    if(inp){inp.focus();inp.addEventListener('keydown',e=>{if(e.key==='Enter')checkMkTyped();});}
  }
}

// VORMEN
function genVormenQ(){
  const pool = mkLevel===1 ? ['vierkant','rechthoek','driehoek','cirkel']
             : mkLevel===2 ? ['vierkant','rechthoek','driehoek','cirkel','ruit','trapezium']
             : MK_KEYS;
  const key = nextFromQueue(pool);
  const correct = MK_SHAPES[key].naam;

  if(mkLevel<3){
    const wrongs = pool.filter(k=>k!==key);
    const opts = shuffleArr([correct, ...shuffleArr(wrongs).slice(0,3).map(k=>MK_SHAPES[k].naam)]);
    return { svg:mkSVG(key), vraag:'Welke figuur zie je?', type:'mc', correct, inputHTML:mkMCHTML(opts,correct) };
  }
  return {
    svg:mkSVG(key), vraag:'Typ de naam van deze figuur:', type:'type', correct,
    inputHTML:`<div class="t-input-wrap"><input class="t-input" id="mk-type-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Typ hier..."/><button class="t-submit" onclick="checkMkTyped()">OK</button></div>`
  };
}

// EIGENSCHAPPEN
function genEigenschappenQ(){
  const pool = mkLevel===1 ? ['vierkant','rechthoek','driehoek','cirkel']
             : MK_KEYS;
  const key = nextFromQueue(pool);
  const s = MK_SHAPES[key];

  // Bouw een lijst mogelijke vragen, filter ongeldige
  const vragen = [
    s.zijden>0 && { v:`Hoeveel zijden heeft een ${s.naam}?`, a:`${s.zijden}`, type:'num' },
    s.hoeken>0 && { v:`Hoeveel hoeken heeft een ${s.naam}?`, a:`${s.hoeken}`, type:'num' },
    { v:`Heeft een ${s.naam} gelijke zijden?`, a:s.gelijkZijden?'ja':'nee', type:'janee' },
    { v:`Heeft een ${s.naam} rechte hoeken (90°)?`, a:s.rechteHoeken?'ja':'nee', type:'janee' },
  ].filter(Boolean);

  const chosen = vragen[Math.floor(Math.random()*vragen.length)];
  const correct = chosen.a;

  if(chosen.type==='janee'){
    return {
      svg:mkSVG(key), vraag:chosen.v, type:'mc', correct,
      inputHTML:`<div style="display:flex;gap:12px;justify-content:center;">${['ja','nee'].map((o,i)=>`<button class="mc-option" onclick="checkMkMC(this)" data-val="${o}" style="flex:1;max-width:120px;"><span class="mc-text" style="font-size:18px;">${o}</span></button>`).join('')}</div>`
    };
  }
  const num = parseInt(correct);
  const wrong = shuffleArr([...new Set([num-1,num+1,num+2,num-2].filter(n=>n>=0&&n!==num))]).slice(0,3);
  const opts = shuffleArr([correct,...wrong.map(String)]);
  return { svg:mkSVG(key), vraag:chosen.v, type:'mc', correct, inputHTML:mkMCHTML(opts,correct) };
}

// BEREKENEN
function genBerekeningQ(){
  const scenarios = [
    // Vierkant omtrek
    ()=>{ const z=rnd(2,15); return { key:'vierkant', vraag:`Vierkant met zijde ${z} cm. Wat is de omtrek?`, correct:`${4*z}`, eenheid:'cm', hint:`4 × ${z}` }; },
    // Vierkant opp
    ()=>{ const z=rnd(2,12); return { key:'vierkant', vraag:`Vierkant met zijde ${z} cm. Wat is de oppervlakte?`, correct:`${z*z}`, eenheid:'cm²', hint:`${z} × ${z}` }; },
    // Rechthoek omtrek
    ()=>{ const l=rnd(4,15),b=rnd(2,9); return { key:'rechthoek', vraag:`Rechthoek: lengte ${l} cm, breedte ${b} cm. Wat is de omtrek?`, correct:`${2*(l+b)}`, eenheid:'cm', hint:`2 × (${l} + ${b})` }; },
    // Rechthoek opp
    ()=>{ const l=rnd(4,15),b=rnd(2,9); return { key:'rechthoek', vraag:`Rechthoek: lengte ${l} cm, breedte ${b} cm. Wat is de oppervlakte?`, correct:`${l*b}`, eenheid:'cm²', hint:`${l} × ${b}` }; },
    // Driehoek omtrek
    ()=>{ const a=rnd(3,10),b2=rnd(3,10),c=rnd(3,10); return { key:'driehoek', vraag:`Driehoek met zijden ${a} cm, ${b2} cm en ${c} cm. Wat is de omtrek?`, correct:`${a+b2+c}`, eenheid:'cm', hint:`${a} + ${b2} + ${c}` }; },
    // Driehoek opp
    ()=>{ const g=rnd(4,14),h=rnd(2,10); const opp=g*h/2; return { key:'driehoek', vraag:`Driehoek: grondlijn ${g} cm, hoogte ${h} cm. Wat is de oppervlakte?`, correct:`${opp%1===0?opp:opp.toFixed(1)}`, eenheid:'cm²', hint:`(${g} × ${h}) ÷ 2` }; },
  ];

  const sc = scenarios[Math.floor(Math.random()*scenarios.length)]();
  const correct = String(sc.correct);

  if(mkLevel===3){
    return {
      svg:mkSVG(sc.key),
      vraag: sc.vraag + (sc.hint?`<div style="font-size:12px;color:var(--tx2);margin-top:4px;">💡 Tip: ${sc.hint}</div>`:''),
      type:'type', correct,
      inputHTML:`<div style="font-size:12px;color:var(--tx2);margin-bottom:6px;">Geef alleen het getal (in ${sc.eenheid})</div><div class="t-input-wrap"><input class="t-input" id="mk-type-input" autocomplete="off" autocorrect="off" autocapitalize="off" inputmode="decimal" spellcheck="false" placeholder="Typ hier..."/><button class="t-submit" onclick="checkMkTyped()">OK</button></div>`
    };
  }
  const num = parseFloat(correct);
  const wrong = shuffleArr([...new Set([num+1,num-1,num+2,num*2].map(n=>n%1===0?n:parseFloat(n.toFixed(1))).filter(n=>n>0&&n!==num))]).slice(0,3);
  const opts = shuffleArr([correct,...wrong.map(String)]);
  return {
    svg:mkSVG(sc.key),
    vraag: sc.vraag,
    type:'mc', correct,
    inputHTML:mkMCHTML(opts.map(o=>`${o} ${sc.eenheid}`),`${correct} ${sc.eenheid}`)
  };
}

// HOEKEN
const MK_HOEKEN = [
  { naam:'rechte hoek', graden:90,  svg:`<line x1="30" y1="180" x2="30" y2="40" stroke="var(--accent)" stroke-width="3"/><line x1="30" y1="180" x2="200" y2="180" stroke="var(--accent)" stroke-width="3"/><rect x="30" y="155" width="25" height="25" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`, type:'recht' },
  { naam:'scherpe hoek', graden:45, svg:`<line x1="20" y1="190" x2="220" y2="190" stroke="var(--accent)" stroke-width="3"/><line x1="20" y1="190" x2="140" y2="40" stroke="var(--accent)" stroke-width="3"/><path d="M 60,190 A 40,40 0 0,1 38,155" fill="none" stroke="var(--accent2)" stroke-width="2.5"/>`, type:'scherp' },
  { naam:'stompe hoek', graden:120, svg:`<line x1="20" y1="170" x2="220" y2="170" stroke="var(--accent)" stroke-width="3"/><line x1="20" y1="170" x2="110" y2="40" stroke="var(--accent)" stroke-width="3"/><path d="M 65,170 A 45,45 0 0,1 32,145" fill="none" stroke="var(--accent2)" stroke-width="2.5"/>`, type:'stomp' },
  { naam:'gestrekte hoek', graden:180, svg:`<line x1="15" y1="120" x2="225" y2="120" stroke="var(--accent)" stroke-width="3"/><circle cx="120" cy="120" r="6" fill="var(--accent)"/><path d="M 155,120 A 35,35 0 0,1 85,120" fill="none" stroke="var(--accent2)" stroke-width="2.5"/>`, type:'gestrekt' },
];

function genHoekenQ(){
  const h = nextFromQueue(MK_HOEKEN.map((_,i)=>i));
  const hoek = MK_HOEKEN[h];
  const hsvg = `<svg viewBox="0 0 240 220" width="150" height="130" style="display:block;margin:0 auto 8px;">${hoek.svg}</svg>`;

  if(mkLevel===1){
    // Herken type naam
    const opts = shuffleArr(MK_HOEKEN.map(h2=>h2.type));
    return { svg:hsvg, vraag:'Welk soort hoek is dit?', type:'mc', correct:hoek.type, inputHTML:mkMCHTML(opts,hoek.type) };
  }
  if(mkLevel===2){
    // Hoeveel graden?
    const allGraden = MK_HOEKEN.map(h2=>String(h2.graden));
    const opts = shuffleArr([...new Set(allGraden)]);
    return { svg:hsvg, vraag:'Hoeveel graden heeft deze hoek?', type:'mc', correct:String(hoek.graden), inputHTML:mkMCHTML(opts.map(o=>o+'°'),hoek.graden+'°') };
  }
  // Niveau 3: typ de naam
  return {
    svg:hsvg, vraag:'Hoe heet dit soort hoek?', type:'type', correct:hoek.type,
    inputHTML:`<div style="font-size:12px;color:var(--tx2);margin-bottom:6px;">recht / scherp / stomp / gestrekt</div><div class="t-input-wrap"><input class="t-input" id="mk-type-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Typ hier..."/><button class="t-submit" onclick="checkMkTyped()">OK</button></div>`
  };
}

// ── Check functies ──
function checkMkMC(btn){
  if(mkAnswered)return;
  mkAnswered=true;
  const correct=mkCurrentQ.correct;
  const given=btn.dataset.val||btn.querySelector('.mc-text').textContent;
  // strip eenheid voor vergelijking
  const givenClean=given.replace(/\s*(cm²|cm|°)/g,'').trim();
  const correctClean=correct.replace(/\s*(cm²|cm|°)/g,'').trim();
  const ok=givenClean===correctClean;
  document.querySelectorAll('#mk-input-area .mc-option').forEach(b=>{
    b.disabled=true;
    const bVal=(b.dataset.val||b.querySelector('.mc-text').textContent).replace(/\s*(cm²|cm|°)/g,'').trim();
    if(bVal===correctClean) b.classList.add('mc-correct');
    else if(b===btn&&!ok) b.classList.add('mc-wrong');
    else b.style.opacity='0.4';
  });
  handleMkResult(ok, correct);
}

function checkMkTyped(){
  if(mkAnswered)return;
  const inp=document.getElementById('mk-type-input');
  if(!inp||!inp.value.trim())return;
  mkAnswered=true;
  const given=inp.value.trim().toLowerCase().replace(/\s+/g,' ');
  const correct=mkCurrentQ.correct.toLowerCase();
  const ok=given===correct||given.replace(/[^0-9,.]/g,'').replace(',','.')===correct.replace(/[^0-9.]/g,'');
  inp.disabled=true;
  inp.style.borderColor=ok?'var(--green)':'var(--red)';
  handleMkResult(ok, mkCurrentQ.correct);
}

function handleMkResult(ok, correct){
  if(ok){mkScore.good++;mkScore.streak++;}else{mkScore.bad++;mkScore.streak=0;}
  updateMkScore();
  const msgs=['Uitstekend! ✓','Goed zo! ✓','Super! ✓','Correct! ✓','Bravo! ✓'];
  const msg=ok?msgs[Math.floor(Math.random()*msgs.length)]:`Fout. Het juiste antwoord is: <strong>${correct}</strong>`;
  const cls=ok?'t-fb-ok':'t-fb-no';
  const fb=document.getElementById('mk-feedback');
  if(fb)fb.innerHTML=`
    <div class="t-feedback ${cls}" style="margin-top:10px;">${msg}</div>
    <button class="t-next" style="margin-top:10px;width:100%;" onclick="loadMkQ()">Volgende →</button>`;
  if(ok)snd('ok');else snd('no');
}

      localStorage.removeItem(SK.woorden);
      localStorage.removeItem(SK.zegswijzen);
      localStorage.setItem('leerheld_version', APP_VERSION);
    }
    const ww=localStorage.getItem(SK.ww);
    if(ww){const p=JSON.parse(ww);if(p&&p.length>0)W.splice(0,W.length,...p);}
    const wd=localStorage.getItem(SK.woorden);

function tyStart(){
  const text = tyPickText(tyLesson);
  tyWords=text.split('');
  tyPos=0; tyCorrect=0; tyErrors=0; tyStreak=0;
  tyUpdateStats();
  const fb=document.getElementById('ty-feedback');if(fb)fb.style.display='none';
  const hint=document.getElementById('ty-hint');if(hint)hint.textContent='';
  tyRenderPrompt();
  tyBuildLessonBtns();
  tyResetHands();
  tyHighlightActive();
}

function tyRenderPrompt(){
  const pt=document.getElementById('ty-prompt');if(!pt)return;
  pt.innerHTML='';
  let i=0;
  while(i<tyWords.length){
    if(tyWords[i]===' '){
      const sp=document.createElement('span');
      sp.className='ty-word-space '+tyCharCls(i);
      sp.dataset.idx=i; sp.textContent='\u00a0';
      pt.appendChild(sp); i++;
    } else {
      const grp=document.createElement('span'); grp.className='ty-word-group';
      while(i<tyWords.length && tyWords[i]!==' '){
        const s=document.createElement('span');
        s.className=tyCharCls(i); s.dataset.idx=i; s.textContent=tyWords[i];
        grp.appendChild(s); i++;
      }
      pt.appendChild(grp);
    }
  }
}

function tyCharCls(i){
  return i<tyPos?'ty-done':i===tyPos?'ty-active':'ty-todo';
}

function tyUpdateCharSpan(idx,cls){
  const s=document.querySelector(`#ty-prompt [data-idx="${idx}"]`);
  if(!s)return;
  const isSpace=s.classList.contains('ty-word-space');
  s.className=cls+(isSpace?' ty-word-space':'');
}

function tyHighlightActive(){
  Object.values(tyKeyEls).forEach(k=>k.classList.remove('ty-key-active'));
  tyResetHands();
  if(tyPos>=tyWords.length)return;
  const ch=tyWords[tyPos].toLowerCase();
  const fid=TY_KEY_FINGER[ch];
  if(tyKeyEls[ch])tyKeyEls[ch].classList.add('ty-key-active');
  if(fid){
    const hint=document.getElementById('ty-hint');
    if(hint)hint.innerHTML=`👆 Gebruik je <strong>${TY_FINGER_NAMES[fid]}</strong>`;
    tyHighlightFinger(fid);
  }
}

function tyResetHands(){
  if(tyActiveFinger){
    const g=document.getElementById(TY_HAND_MAP[tyActiveFinger]);
    if(g){g.classList.remove('ty-finger-bounce');g.querySelectorAll('.ty-finger-part').forEach(el=>el.style.fill='');}
    tyActiveFinger=null;
  }
}

function tyHighlightFinger(fid){
  const id=TY_HAND_MAP[fid];if(!id)return;
  const g=document.getElementById(id);if(!g)return;
  g.querySelectorAll('.ty-finger-part').forEach(el=>el.style.fill=TY_FINGER_COLORS[fid]);
  g.classList.add('ty-finger-bounce');
  tyActiveFinger=fid;
}

function tyFlashKey(k,ok){
  const el=tyKeyEls[k];if(!el)return;
  el.classList.add(ok?'ty-ok':'ty-bad');
  setTimeout(()=>el.classList.remove('ty-ok','ty-bad'),260);
}

function tyUpdateStats(){
  const g=document.getElementById('ty-sc-correct'),
        e=document.getElementById('ty-sc-errors'),
        s=document.getElementById('ty-sc-streak'),
        p=document.getElementById('ty-sc-pct');
  if(g)g.textContent=tyCorrect;
  if(e)e.textContent=tyErrors;
  if(s)s.textContent=tyStreak;
  const tot=tyCorrect+tyErrors;
  if(p)p.textContent=tot>0?Math.round(tyCorrect/tot*100)+'%':'—';
}

function tyShowFeedback(pct){
  let pool;
  if(pct===100)pool=TY_FEEDBACK.perfect;
  else if(pct>=80)pool=TY_FEEDBACK.great;
  else if(pct>=50)pool=TY_FEEDBACK.ok;
  else pool=TY_FEEDBACK.poor;
  const f=pool[Math.floor(Math.random()*pool.length)];
  const numStars=pct===100?5:pct>=80?4:pct>=60?3:pct>=40?2:1;
  const stars=[0,1,2,3,4].map(i=>`<span class="ty-fb-star${i<numStars?' on':''}" style="animation-delay:${i*0.1}s">★</span>`).join('');
  const fb=document.getElementById('ty-feedback');if(!fb)return;
  fb.innerHTML=`
    <div class="ty-fb-emoji">${f.emoji}</div>
    <div class="ty-fb-title">${f.title}</div>
    <div class="ty-fb-stars">${stars}</div>
    <div class="ty-fb-msg">${f.msg}</div>
    <div class="ty-fb-stats">
      <div class="ty-fb-stat"><span class="ty-fb-stat-num" style="color:var(--accent)">${tyCorrect}</span><span class="ty-fb-stat-lbl">goed</span></div>
      <div class="ty-fb-stat"><span class="ty-fb-stat-num" style="color:#E05252">${tyErrors}</span><span class="ty-fb-stat-lbl">foutjes</span></div>
      <div class="ty-fb-stat"><span class="ty-fb-stat-num" style="color:var(--accent)">${pct}%</span><span class="ty-fb-stat-lbl">score</span></div>
    </div>
    <button class="ty-fb-btn" onclick="tyStart()">🎯 Nog een oefening!</button>`;
  fb.style.display='block';
  fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function tyAddKeyListener(){
  if(tyListening)return;
  tyListening=true;
  document.addEventListener('keydown',function tyKeyHandler(e){
    // Only handle when typen tab is active
    if(document.getElementById('typen-root').style.display==='none')return;
    if(tyPos>=tyWords.length)return;
    e.preventDefault();
    const typed=e.key===' '?' ':(e.key.length===1?e.key:null);
    if(!typed)return;
    const expected=tyWords[tyPos];
    if(typed.toLowerCase()===expected.toLowerCase()){
      tyFlashKey(expected.toLowerCase(),true);
      tyUpdateCharSpan(tyPos,'ty-done');
      tyCorrect++; tyStreak++; tyPos++;
      if(tyPos>=tyWords.length){
        tyUpdateStats(); tyResetHands();
        Object.values(tyKeyEls).forEach(k=>k.classList.remove('ty-key-active'));
        const hint=document.getElementById('ty-hint');if(hint)hint.textContent='';
        tyShowFeedback(Math.round(tyCorrect/(tyCorrect+tyErrors)*100));
      } else {
        tyUpdateCharSpan(tyPos,'ty-active');
        tyHighlightActive();
      }
    } else {
      tyFlashKey(expected.toLowerCase(),false);
      tyErrors++; tyStreak=0;
    }
    tyUpdateStats();
  });
}

const MAX_PROFIELEN = 6;
const PROFIEL_AVATARS = ['🦁','🐯','🦊','🐻','🐼','🐨','🦄','🐸','🐧','🦋','🐲','⭐','🚀','🎯','🎨','🎸','🏆','🌈'];
const SK_PROFIELEN = 'lh_profielen';
const SK_HUIDIG_PROFIEL = 'lh_huidig_profiel';

let huidigProfiel = null; // {id, naam, avatar}

function loadProfielen(){
  try{ return JSON.parse(localStorage.getItem(SK_PROFIELEN)||'[]'); }catch(e){return[];}
}
function saveProfielen(p){ localStorage.setItem(SK_PROFIELEN, JSON.stringify(p)); }

function getProfielStats(profielId){
  try{
    const raw = localStorage.getItem('lh_stats_'+profielId);
    return raw ? JSON.parse(raw) : {oefeningen:0, goed:0, fout:0, perOnderdeel:{}, sessies:[]};
  }catch(e){return {oefeningen:0,goed:0,fout:0,perOnderdeel:{},sessies:[]};}
}
function saveProfielStats(profielId, stats){
  localStorage.setItem('lh_stats_'+profielId, JSON.stringify(stats));
}

// Registreer een resultaat voor het huidig profiel
function trackOefening(onderdeel, goed, fout){
  if(!huidigProfiel) return;
  const stats = getProfielStats(huidigProfiel.id);
  stats.oefeningen += goed + fout;
  stats.goed += goed;
  stats.fout += fout;
  if(!stats.perOnderdeel[onderdeel]) stats.perOnderdeel[onderdeel]={oefeningen:0,goed:0,fout:0};
  stats.perOnderdeel[onderdeel].oefeningen += goed+fout;
  stats.perOnderdeel[onderdeel].goed += goed;
  stats.perOnderdeel[onderdeel].fout += fout;
  // Voeg sessie toe (max 50 bewaren)
  stats.sessies = [{datum:new Date().toLocaleDateString('nl-BE'), tijd:new Date().toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'}), onderdeel, goed, fout},...(stats.sessies||[])].slice(0,50);
  saveProfielStats(huidigProfiel.id, stats);
}

// ── Profiel kiezen / aanmaken ──
function initProfiel(){
  const opgeslagen = localStorage.getItem(SK_HUIDIG_PROFIEL);
  if(opgeslagen){
    try{
      huidigProfiel = JSON.parse(opgeslagen);
      updateProfielBtn();
      return;
    }catch(e){}
  }
  // Eerste keer: toon profielkeuze
  openProfielKeuze(true);
}

function updateProfielBtn(){
  const btn = document.getElementById('profiel-btn');
  if(btn && huidigProfiel) btn.textContent = huidigProfiel.avatar;
}

function openProfielKeuze(verplicht=false){
  const overlay = document.getElementById('profiel-overlay');
  const closeBtn = document.getElementById('profiel-close-btn');
  const titel = document.getElementById('profiel-modal-titel');
  if(closeBtn) closeBtn.style.display = verplicht ? 'none' : '';
  if(titel) titel.textContent = verplicht ? '👤 Wie ben jij?' : '👤 Profiel kiezen';
  overlay.style.display = 'flex';
  renderProfielKeuze();
}

function closeProfiel(){
  document.getElementById('profiel-overlay').style.display='none';
}

function renderProfielKeuze(){
  const el = document.getElementById('profiel-content'); if(!el) return;
  const profielen = loadProfielen();
  const lege = MAX_PROFIELEN - profielen.length;

  let html = '<div class="profiel-grid">';
  profielen.forEach(p=>{
    const actief = huidigProfiel && huidigProfiel.id===p.id;
    const stats = getProfielStats(p.id);
    html+=`<div class="profiel-card${actief?' actief':''}" onclick="kiesProfiel('${p.id}')">
      ${actief?'<span class="profiel-actief-badge">✓ actief</span>':''}
      <div class="profiel-avatar">${p.avatar}</div>
      <div class="profiel-naam">${p.naam}</div>
      <div class="profiel-badge">${stats.oefeningen} oefeningen</div>
    </div>`;
  });
  for(let i=0;i<lege;i++){
    html+=`<div class="profiel-card leeg" onclick="toonNieuwProfielForm()">
      <div class="profiel-avatar">➕</div>
      <div class="profiel-naam" style="color:var(--tx2)">Nieuw profiel</div>
    </div>`;
  }
  html += '</div>';
  html += '<div id="nieuw-profiel-form"></div>';
  el.innerHTML = html;
}

    {id:'bliksem',ico:'⚡',name:'Flash'},

function kiesThema(el, thema){
  document.querySelectorAll('#thema-keuze .leerjaar-btn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
}

function maakProfiel(){
  const naam = (document.getElementById('nieuw-naam')||{value:''}).value.trim();
  if(!naam){alert('Geef een naam in!');return;}
  const avatarEl = document.querySelector('.profiel-avatar-opt.on');
  const avatar = avatarEl ? avatarEl.dataset.avatar : '🦁';
  const themaEl = document.querySelector('#thema-keuze .leerjaar-btn.on');
  const thema = themaEl ? themaEl.dataset.thema : 'vuur';
  const profielen = loadProfielen();
  if(profielen.length>=MAX_PROFIELEN){alert('Maximum aantal profielen bereikt.');return;}
  const id = 'p_'+Date.now();
  profielen.push({id, naam, avatar, thema});
  saveProfielen(profielen);
  kiesProfiel(id);
}

function kiesProfiel(id){
  const profielen = loadProfielen();
  const p = profielen.find(x=>x.id===id);
  if(!p) return;
  huidigProfiel = p;
  localStorage.setItem(SK_HUIDIG_PROFIEL, JSON.stringify(p));
  updateProfielBtn();
  // Pas thema toe indien ingesteld
  if(p.thema){
    document.body.dataset.hero = p.thema;
    const sel = document.getElementById('hero-select');
    if(sel) sel.value = p.thema;
    cfg.hero = HEROES.find(h=>h.id===p.thema)||HEROES[0];
  }
  closeProfiel();
}

function verwijderProfiel(id){
  if(!confirm('Profiel en alle statistieken verwijderen?')) return;
  let profielen = loadProfielen();
  profielen = profielen.filter(p=>p.id!==id);
  saveProfielen(profielen);
  localStorage.removeItem('lh_stats_'+id);
  if(huidigProfiel && huidigProfiel.id===id){
    huidigProfiel=null;
    localStorage.removeItem(SK_HUIDIG_PROFIEL);
    updateProfielBtn();
  }
  renderProfielKeuze();
}

const MAX_FOUTEN = 200; // max opgeslagen fouten

function loadFouten(){
  try{ return JSON.parse(localStorage.getItem(SK.fouten)||'[]'); }catch(e){return[];}
}
function saveFouten(fouten){
  localStorage.setItem(SK.fouten, JSON.stringify(fouten.slice(-MAX_FOUTEN)));
}
function addFout(type, vraag, foutAntwoord, juistAntwoord, extra){
  const fouten = loadFouten();
  fouten.push({
    type,       // 'rekenen' | 'werkwoord' | 'woordenschat' | 'zegswijze'
    vraag,
    fout: foutAntwoord,
    juist: juistAntwoord,
    extra: extra||'',
    datum: new Date().toLocaleDateString('nl-BE'),
    ts: Date.now()
  });
  saveFouten(fouten);
}
function clearFouten(type){
  if(type){
    saveFouten(loadFouten().filter(f=>f.type!==type));
  } else {
    localStorage.removeItem(SK.fouten);
  }
}

// ── Globaal foutenrapport tabblad ──
function renderFoutenTab(){
  const el = document.getElementById('fouten-content'); if(!el)return;
  const fouten = loadFouten();
  const types = ['rekenen','werkwoord','woordenschat','zegswijze'];
  const typeLabels = {rekenen:'🔢 Rekenen', werkwoord:'📝 Werkwoorden', woordenschat:'📖 Woordenschat', zegswijze:'💬 Zegswijzen'};

  if(fouten.length===0){
    el.innerHTML='<div style="text-align:center;padding:2rem;color:var(--tx2);">🎉 Geen fouten opgeslagen! Maak eerst een oefening.</div>';
    return;
  }

  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <span style="font-size:13px;color:var(--tx2);">${fouten.length} fout${fouten.length!==1?'en':''} opgeslagen</span>
    <button onclick="clearFouten();renderFoutenTab();" style="padding:5px 12px;border-radius:12px;border:1px solid var(--surface3);background:var(--surface2);color:var(--tx2);font-size:12px;cursor:pointer;">🗑 Alles wissen</button>
  </div>`;

  types.forEach(type=>{
    const groep = fouten.filter(f=>f.type===type).reverse();
    if(groep.length===0)return;
    html += `<div class="fr-blok">
      <div class="fr-blok-titel" style="display:flex;justify-content:space-between;align-items:center;">
        <span>${typeLabels[type]} (${groep.length})</span>
        <button onclick="clearFouten('${type}');renderFoutenTab();" style="padding:3px 10px;border-radius:10px;border:1px solid var(--surface3);background:var(--surface2);color:var(--tx2);font-size:11px;cursor:pointer;">Wissen</button>
      </div>
      <div class="fr-tabel-wrap"><table class="fr-tabel">
        <thead><tr><th>Datum</th><th>Vraag</th><th>Jouw antwoord</th><th>Juist antwoord</th>${type!=='rekenen'?'<th>Info</th>':''}</tr></thead>
        <tbody>${groep.slice(0,50).map(f=>`<tr>
          <td style="white-space:nowrap;color:var(--tx2);font-size:11px;">${f.datum}</td>
          <td><strong>${f.vraag}</strong></td>
          <td class="fr-fout">${f.fout||'—'}</td>
          <td class="fr-juist">${f.juist}</td>
          ${type!=='rekenen'?`<td style="font-size:11px;color:var(--tx2);">${f.extra||''}</td>`:''}
        </tr>`).join('')}</tbody>
      </table></div>
      ${groep.length>50?`<p style="font-size:12px;color:var(--tx2);text-align:center;margin-top:6px;">... en nog ${groep.length-50} meer</p>`:''}
    </div>`;
  });

  el.innerHTML = html;
}

// ── Uitspraak ──
let frAudio=null;
function frSpreek(tekst){
  let t=tekst.trim().replace(/[!?.…]+$/,'').replace(/\//g,' ').toLowerCase();
  if(frAudio){frAudio.pause();frAudio.currentTime=0;}
  const url=`https://translate.googleapis.com/translate_tts?ie=UTF-8&tl=fr&client=gtx&q=${encodeURIComponent(t)}&ttsspeed=0.8`;
  frAudio=new Audio(url);
  frAudio.play().catch(()=>{
    if(!window.speechSynthesis)return;
    window.speechSynthesis.cancel();
    setTimeout(()=>{
      const u=new SpeechSynthesisUtterance(t);
      u.lang='fr-FR';u.rate=0.82;
      const fr=window.speechSynthesis.getVoices().find(v=>v.lang==='fr-FR');
      if(fr)u.voice=fr;
      window.speechSynthesis.speak(u);
    },80);
  });
}
function frSpreekKnop(tekst){
  const t=tekst.replace(/'/g,"&#39;");
  return `<button onclick="frSpreek('${t}')" title="Uitspreken" style="background:none;border:none;cursor:pointer;font-size:16px;padding:2px 4px;opacity:0.7;transition:opacity 0.15s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.7'">🔊</button>`;
}

let _frSqTimer=null;
function frSchoolStartTimer(antwoord, isFr){
  if(_frSqTimer) clearInterval(_frSqTimer);
  const timerEl=document.getElementById('fr-sq-timer');
  if(!timerEl)return;
  let secs=5;
  timerEl.innerHTML=frTimerRing(secs);
  _frSqTimer=setInterval(()=>{
    secs--;
    const t=document.getElementById('fr-sq-timer');
    if(!t){clearInterval(_frSqTimer);return;}
    if(secs<=0){
      clearInterval(_frSqTimer);
      frSchoolReveal();
    } else {
      t.innerHTML=frTimerRing(secs);
    }
  },1000);
}

function frTimerRing(secs){
  const pct=(secs/5)*100;
  const r=22, circ=2*Math.PI*r;
  const offset=circ*(1-pct/100);
  return `<div style="display:flex;align-items:center;justify-content:center;gap:10px;">
    <svg width="56" height="56" style="transform:rotate(-90deg);">
      <circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--surface3)" stroke-width="4"/>
      <circle cx="28" cy="28" r="${r}" fill="none" stroke="${secs<=2?'var(--no)':'var(--accent)'}" stroke-width="4"
        stroke-dasharray="${circ}" stroke-dashoffset="${offset}" style="transition:stroke-dashoffset 0.9s linear;"/>
    </svg>
    <span style="font-family:'Fredoka',sans-serif;font-size:28px;font-weight:700;color:${secs<=2?'var(--no)':'var(--accent)'};">${secs}</span>
  </div>`;
}

function frSchoolReveal(){
  if(frSchoolRevealed)return;
  frSchoolRevealed=true;
  if(_frSqTimer){clearInterval(_frSqTimer);_frSqTimer=null;}
  const timer=document.getElementById('fr-sq-timer');
  if(timer)timer.innerHTML='';
  const ant=document.getElementById('fr-sq-antwoord');
  if(ant){ant.style.display='block';ant.style.animation='slideUp 0.25s ease';}
  const kn=document.getElementById('fr-sq-knoppen');
  if(kn){kn.style.display='flex';}
  const hint=document.querySelector('#fr-school-inner p');
  if(hint)hint.style.display='none';
}

  const extraThemas=[...new Set(FR_WOORDEN.filter(w=>w[4]!=='school').map(w=>w[2]))].sort((a,b)=>a-b);
  const themaBar=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center;">
    <span class="filter-lbl">Thema:</span>
    <button class="filter-btn${frThema===0?' on':''}" onclick="frThema=0;frRenderWsLijst()">Alle</button>
    ${extraThemas.map(t=>`<button class="filter-btn${frThema===t?' on':''}" onclick="frThema=${t};frRenderWsLijst()">${FR_THEMA_NAMEN[t]||'T'+t}</button>`).join('')}
  </div>`;
  el.innerHTML=themaBar+`
    <input class="t-search" type="text" id="fr-ws-zoek" placeholder="🔍 Zoek een woord..." autocomplete="off" style="margin-bottom:10px;width:100%;"/>
    <div id="fr-ws-lijst"></div>`;
  frRenderWsLijst();
  const inp=document.getElementById('fr-ws-zoek');
  if(inp) inp.addEventListener('input',function(){ frRenderWsLijst(this.value); });
}

function frRenderWsLijst(zoek){
  const el=document.getElementById('fr-ws-lijst');if(!el)return;
  const q=(zoek||'').toLowerCase();
  let pool=FR_WOORDEN.filter(w=>w[4]!=='school');
  if(frThema) pool=pool.filter(w=>w[2]===frThema);
  pool=pool.filter(w=>!q||w[0].toLowerCase().includes(q)||w[1].toLowerCase().includes(q));
  const themas=[...new Set(pool.map(w=>w[2]))].sort((a,b)=>a-b);
  el.innerHTML=(themas.length?themas.map(t=>{
    const items=pool.filter(w=>w[2]===t);
    return `<div style="margin-bottom:14px;">
      <div style="font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px;">${FR_THEMA_NAMEN[t]||'Thema '+t}</div>
      <div class="fr-tabel-wrap" style="border:1px solid var(--surface3);border-radius:var(--radius-sm);overflow:hidden;">
        <table class="fr-tabel">
          <thead><tr><th>🇫🇷 Frans</th><th>🇧🇪 Nederlands</th><th style="width:36px;"></th></tr></thead>
          <tbody>${items.map(w=>`<tr><td><strong>${w[0]}</strong></td><td>${w[1]}</td><td style="text-align:center;">${frSpreekKnop(w[0])}</td></tr>`).join('')}</tbody>
        </table>
      </div>
    </div>`;
  }).join(''):'<p style="text-align:center;color:var(--tx3);padding:1rem;">Geen resultaten.</p>')+`<p class="t-hint">${pool.length} woorden</p>`;
}

function frGetPool(){
  // Quiz gebruikt school + extra; woordenschat heeft eigen pool
  return frThema===0 ? FR_WOORDEN : FR_WOORDEN.filter(w=>w[2]===frThema);
}

function frRenderWwQuiz(){
  const el=document.getElementById('fr-ww-content');if(!el)return;
  const combos=[];
  FR_WERKWOORDEN.forEach((w,wi)=>{[0,1,2,3,4,5].forEach(pi=>combos.push({wi,pi}));});
  if(frWwQueue.length===0) frWwQueue=[...combos].sort(()=>Math.random()-0.5);
  const {wi,pi}=frWwQueue.shift();
  const ww=FR_WERKWOORDEN[wi];
  const correct=ww[pi+1];
  el.innerHTML=`
    <div class="t-quiz-card">
      <div class="t-quiz-meta"><span class="t-prog" id="fr-ww-prog">Vraag ${++frTotal}</span></div>
      <div style="text-align:center;margin-bottom:8px;">
        <div style="font-size:13px;color:var(--tx2);margin-bottom:4px;">Vervoeging van:</div>
        <div style="font-size:26px;font-weight:700;color:var(--tx);">${ww[0]}</div>
        <div style="font-size:13px;color:var(--tx2);margin-top:4px;">(= ${ww[7]})</div>
      </div>
      <div style="font-size:15px;font-weight:600;color:var(--tx);margin-bottom:14px;text-align:center;">
        Hoe vervoeg je <em>${ww[0]}</em> voor <strong>${FR_PROFIELEN[pi]}</strong> (${FR_PROFIEL_NL[pi]})?
      </div>
      <div class="t-input-wrap">
        <input class="t-input" id="fr-ww-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Typ de vervoeging..." style="font-size:16px;"/>
        <button class="t-submit" onclick="frCheckWw('${correct.replace(/'/g,"\\'")}')">OK</button>
      </div>
      <p class="type-hint">Druk Enter om te controleren.</p>
      <div id="fr-ww-fb"></div>
    </div>`;
  const inp=document.getElementById('fr-ww-input');
  if(inp){inp.focus();inp.addEventListener('keydown',e=>{if(e.key==='Enter')frCheckWw(correct);});}
}

function frCheckWw(correct){
  const inp=document.getElementById('fr-ww-input');if(!inp)return;
  const given=inp.value.trim().toLowerCase();
  const ok=given===correct.toLowerCase();
  inp.disabled=true;
  inp.style.borderColor=ok?'#3B6D11':'#A32D2D';
  const msg=ok?'Correct! ✓':`Fout. Het juiste antwoord is: <strong>${correct}</strong>`;
  const fb=document.getElementById('fr-ww-fb');
  if(fb)fb.innerHTML=`<div class="t-feedback ${ok?'t-fb-ok':'t-fb-no'}" style="margin-top:10px;">${msg}</div>
    <button class="t-next" style="margin-top:10px;width:100%;" onclick="frRenderWerkwoorden()">Volgende →</button>`;
  if(ok){frScore.good++;frScore.streak++;}else{frScore.bad++;frScore.streak=0;}
  trackOefening('frans',ok?1:0,ok?0:1);
  if(ok)snd('ok');else snd('no');
}

function frRenderQuiz(){
  const el=document.getElementById('fr-content');if(!el)return;
  const tot=frScore.good+frScore.bad;
  el.innerHTML=frThemaBar()+`
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;">
      <span class="filter-lbl">Richting:</span>
      <button class="filter-btn${frQuizMode==='nl→fr'?' on':''}" onclick="frQuizMode='nl→fr';frQueue=[];frRenderQuiz()">🇧🇪 → 🇫🇷</button>
      <button class="filter-btn${frQuizMode==='fr→nl'?' on':''}" onclick="frQuizMode='fr→nl';frQueue=[];frRenderQuiz()">🇫🇷 → 🇧🇪</button>
      <button class="filter-btn${frQuizMode==='beide'?' on':''}" onclick="frQuizMode='beide';frQueue=[];frRenderQuiz()">🔀 Beide</button>
    </div>
    <div class="t-score-row">
      <div class="t-score-card"><div class="t-score-num" id="frsc-good">${frScore.good}</div><div class="t-score-lbl">Goed</div></div>
      <div class="t-score-card"><div class="t-score-num" id="frsc-bad">${frScore.bad}</div><div class="t-score-lbl">Fout</div></div>
      <div class="t-score-card"><div class="t-score-num">${tot>0?Math.round(frScore.good/tot*100)+'%':'—'}</div><div class="t-score-lbl">Score</div></div>
      <div class="t-score-card t-streak-card"><div class="t-score-num" id="frsc-streak">${frScore.streak}</div><div class="t-score-lbl">🔥 Reeks</div></div>
    </div>
    <div class="t-quiz-card" id="fr-quiz-card"></div>`;
  frLoadQ();
}

function frLoadQ(){
  frAnswered=false;
  removeStickyNext();
  frTotal++;
  const card=document.getElementById('fr-quiz-card');if(!card)return;
  const pool=frGetPool();
  if(pool.length<4){
    card.innerHTML='<p style="text-align:center;color:var(--tx2);padding:1rem;">Te weinig woorden in dit thema voor een quiz (min. 4).</p>';
    return;
  }
  if(frQueue.length===0) frQueue=[...pool].sort(()=>Math.random()-0.5);
  const item=frQueue.shift();
  frCurrent=item;
  const dir=frQuizMode==='beide'?(Math.random()<0.5?'nl→fr':'fr→nl'):frQuizMode;
  const vraagTekst=dir==='nl→fr'?item[1]:item[0];
  const correctTekst=dir==='nl→fr'?item[0]:item[1];
  const wrongPool=pool.filter(w=>w!==item);
  const wrongs=[...wrongPool].sort(()=>Math.random()-0.5).slice(0,3).map(w=>dir==='nl→fr'?w[0]:w[1]);
  const opties=[correctTekst,...wrongs].sort(()=>Math.random()-0.5);

  card.innerHTML=`
    <div class="t-quiz-meta"><span class="t-prog">Vraag ${frTotal}</span><span class="t-dir-badge">${dir==='nl→fr'?'🇧🇪 → 🇫🇷':'🇫🇷 → 🇧🇪'}</span></div>
    <div style="font-size:13px;color:var(--tx2);margin-bottom:4px;">${FR_THEMA_NAMEN[item[2]]||''}</div>
    <div class="t-word" style="font-size:22px;margin-bottom:6px;">${vraagTekst}</div>
    <div class="t-question">Wat is de vertaling?</div>
    <div class="ak-mc-grid" style="margin-top:12px;">
      ${opties.map((o,i)=>`<button class="ak-mc-opt" onclick="frCheckQ(this,'${o.replace(/'/g,"\\'")}','${correctTekst.replace(/'/g,"\\'")}')">
        <span style="font-size:13px;">${o}</span>
      </button>`).join('')}
    </div>
    <div id="fr-q-fb"></div>`;
}

function frCheckQ(btn,gekozen,correct){
  if(frAnswered)return;
  frAnswered=true;
  const ok=gekozen===correct;
  document.querySelectorAll('#fr-quiz-card .ak-mc-opt').forEach(b=>{
    b.disabled=true;
    const val=b.querySelector('span').textContent.trim();
    if(val===correct)b.classList.add('ok');
    else if(b===btn&&!ok)b.classList.add('no');
    else b.style.opacity='0.4';
  });
  if(ok){frScore.good++;frScore.streak++;}else{frScore.bad++;frScore.streak=0;}
  ['good','bad','streak'].forEach(k=>{const e=document.getElementById('frsc-'+k);if(e)e.textContent=frScore[k];});
  trackOefening('frans',ok?1:0,ok?0:1);
  if(!ok)addFout('frans',`${frCurrent[0]} / ${frCurrent[1]}`,gekozen,correct,FR_THEMA_NAMEN[frCurrent[2]]||'');
  const msgs=['Super! ✓','Goed zo! ✓','Correct! ✓','Bravo! ✓','Parfait! ✓'];
  const msg=ok?msgs[Math.floor(Math.random()*msgs.length)]:`Fout! Het juiste antwoord is: <strong>${correct}</strong>`;
  const cls=ok?'t-fb-ok':'t-fb-no';
  const fb=document.getElementById('fr-q-fb');
  if(fb)fb.innerHTML=`<div class="t-feedback ${cls}" style="margin-top:10px;">${msg}</div>`;
  showStickyNext(msg,cls,'frLoadQ');
  if(ok)snd('ok');else snd('no');
}

function adminSaveWW(i){
  const inf=document.getElementById('edit-ww-inf-'+i).value.trim();
  const stam=document.getElementById('edit-ww-stam-'+i).value.trim();
  const vt=document.getElementById('edit-ww-vt-'+i).value.trim();
  const vd=document.getElementById('edit-ww-vd-'+i).value.trim();
  const onr=document.getElementById('edit-ww-onr-'+i).checked;
  if(!inf||!stam||!vt||!vd){alert('Vul alle 4 velden in.');return;}
  W[i]=[inf,stam,vt,vd,onr];
  W.sort((a,b)=>a[0].localeCompare(b[0]));
  saveWW();renderAdminTab();
}
function adminAddWW(){
  const inf=document.getElementById('ww-inf').value.trim();
  const stam=document.getElementById('ww-stam').value.trim();
  const vt=document.getElementById('ww-vt').value.trim();
  const vd=document.getElementById('ww-vd').value.trim();
  const onr=document.getElementById('ww-onr').checked;
  if(!inf||!stam||!vt||!vd){alert('Vul alle 4 velden in.');return;}
  W.push([inf,stam,vt,vd,onr]);
  W.sort((a,b)=>a[0].localeCompare(b[0]));
  saveWW();
  ['ww-inf','ww-stam','ww-vt','ww-vd'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  document.getElementById('ww-onr').checked=false;
  renderAdminTab();
}
function adminDelWW(i){
  if(!confirm('Werkwoord "'+W[i][0]+'" verwijderen?'))return;
  W.splice(i,1);saveWW();renderAdminTab();
}
function adminResetWW(){
  if(!confirm('Alle aanpassingen aan werkwoorden verwijderen en terugzetten naar de originele lijst?'))return;
  localStorage.removeItem(SK.ww);location.reload();
}

let aardState = {
  tab: 'kaart',
  zoek: '',
  cont: 'Alle',
  selected: null,
  quiz: { vragen: [], cur: 0, score: 0, gekozen: null, type: 'capital' }

function initAardrijkskunde() {
  const panel = document.getElementById('aard-panel');
  if (!panel) return;
  renderAardPanel();
}

function renderAardPanel() {
  const panel = document.getElementById('aard-panel');
  if (!panel) return;
  panel.innerHTML = `
    <div class="aard-subtabs">
      <button class="aard-subtab ${aardState.tab==='kaart'?'on':''}" onclick="aardTab('kaart')">🗺️ Kaart</button>
      <button class="aard-subtab ${aardState.tab==='lijst'?'on':''}" onclick="aardTab('lijst')">📋 Landen</button>
      <button class="aard-subtab ${aardState.tab==='quiz'?'on':''}" onclick="aardTab('quiz')">🎯 Quiz</button>
    </div>
    <div id="aard-content"></div>
  `;
  renderAardContent();
}

function aardTab(t) {
  aardState.tab = t;
  aardState.selected = null;
  if (t === 'quiz') { startAardQuiz(); return; }
  renderAardPanel();
}

function renderAardContent() {
  const el = document.getElementById('aard-content');
  if (!el) return;
  if (aardState.tab === 'kaart') renderAardKaart(el);
  else if (aardState.tab === 'lijst') renderAardLijst(el);
  else if (aardState.tab === 'quiz') renderAardQuizContent(el);
}

function renderAardKaart(el) {
  const land = aardState.selected ? LANDEN.find(l => l.id === aardState.selected) : null;
  el.innerHTML = `
    <input class="aard-search" id="aard-zoek" placeholder="🔍 Zoek een land..." value="${aardState.zoek}" autocomplete="off" spellcheck="false" />
    <div id="aard-zoek-resultaten">${aardState.zoek ? renderZoekResultatenHTML(aardState.zoek) : ''}</div>
    <div id="aard-map-wrap-holder">${aardState.zoek ? '' : renderWorldMap()}</div>
    <div id="aard-country-card">
      ${land ? renderCountryCard(land, true) : '<p style="text-align:center;color:var(--tx3);font-size:13px;margin-top:8px;">Klik op een land op de kaart of zoek hierboven 🌍</p>'}
    </div>
  `;
  // Attach input listener after DOM insert — avoids inline oninput re-render issue
  const inp = document.getElementById('aard-zoek');
  if (inp) {
    inp.addEventListener('input', function() { aardZoek(this.value); });
    if (aardState.zoek) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }
  if (!aardState.zoek) loadD3AndMap();
}

function loadD3AndMap() {
  if (window.d3 && window.topojson) { initInteractiveMap(); return; }
  if (window._d3Loading) { setTimeout(loadD3AndMap, 200); return; }
  window._d3Loading = true;
  const s1 = document.createElement('script');
  s1.src = 'https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js';
  s1.onload = () => {
    const s2 = document.createElement('script');
    s2.src = 'https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js';
    s2.onload = () => { window._d3Loading = false; initInteractiveMap(); };
    document.head.appendChild(s2);
  };
  document.head.appendChild(s1);
}

function renderZoekResultatenHTML(q) {
  q = (q || '').toLowerCase();
  const hits = LANDEN.filter(l => l.name.toLowerCase().includes(q) || l.capital.toLowerCase().includes(q) || l.cont.toLowerCase().includes(q));
  if (!hits.length) return '<p style="text-align:center;color:var(--tx3);font-size:13px;padding:12px;">Geen landen gevonden</p>';
  return `<div style="background:var(--surface2);border-radius:var(--radius-sm);overflow:hidden;max-height:220px;overflow-y:auto;margin-bottom:10px;border:1px solid var(--surface3);">
    ${hits.map(l => `<div class="country-list-item" onclick="selectLand('${l.id}')">
      <span class="cli-flag">${l.flag}</span>
      <div><div class="cli-name">${l.name}</div><div class="cli-cap">🏛️ ${l.capital} · ${l.cont}</div></div>
    </div>`).join('')}
  </div>`;
}

// Pre-built direct map: numeric feature id -> continent color
// This avoids the 3-step chain (numToIso3 -> ISO_TO_LEERHELD -> LANDEN -> CONT_COLORS)
let _numToColorCache = null;
function getNumToColorMap() {
  if (_numToColorCache) return _numToColorCache;
  _numToColorCache = {};
  const n2i = getNumToIso3();
  for (const [num, iso3] of Object.entries(n2i)) {
    const lid = ISO_TO_LEERHELD[iso3];
    if (!lid) continue;
    const land = LANDEN.find(l => l.id === lid);
    if (!land) continue;
    _numToColorCache[num] = { lid, color: CONT_COLORS[land.cont] || '#7C6FFF', land };
  }
  return _numToColorCache;
}

function _featureKey(feature) {
  if (!feature || feature.id === undefined || feature.id === null) return null;
  // world-atlas stores IDs as strings like '036' - normalize by parsing as int
  const n = parseInt(feature.id, 10);
  return isNaN(n) ? null : String(n);
}

function getLid(feature) {
  const key = _featureKey(feature);
  if (!key) return null;
  const entry = getNumToColorMap()[key];
  return entry ? entry.lid : null;
}

function getCountryFill(feature) {
  const key = _featureKey(feature);
  if (!key) return '#2a3a5c';
  const entry = getNumToColorMap()[key];
  if (!entry) return '#2a3a5c';
  if (aardState.selected === entry.lid) return '#FFD166';
  return entry.color;
}

function initInteractiveMap() {
  const container = document.getElementById('aard-map-inner');
  if (!container || !window.d3 || !window.topojson) return;
  // Clear any previous SVG
  container.innerHTML = '';
  _mapSvg = null; _mapG = null; _mapZoom = null;

  const W = container.parentElement.offsetWidth || 680;
  const H = Math.round(W * 0.52);

  const svg = d3.select('#aard-map-inner').append('svg')
    .attr('width', '100%')
    .attr('height', H)
    .attr('viewBox', `0 0 ${W} ${H}`)
    .style('display','block');
  _mapSvg = svg;

  svg.append('rect').attr('width', W).attr('height', H).attr('fill','#0d1b2e');

  const g = svg.append('g');
  _mapG = g;

  const projection = d3.geoNaturalEarth1()
    .scale(W / 6.3)
    .translate([W / 2, H / 2]);
  const path = d3.geoPath().projection(projection);

  const zoom = d3.zoom()
    .scaleExtent([0.8, 8])
    .on('zoom', (event) => { g.attr('transform', event.transform); });
  _mapZoom = zoom;
  svg.call(zoom);

  const tooltip = document.getElementById('aard-map-tooltip');

  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json')
    .then(r => r.json())
    .then(world => {
      const countries = topojson.feature(world, world.objects.countries);

      g.selectAll('path.country')
        .data(countries.features)
        .enter().append('path')
          .attr('class', 'country')
          .attr('d', path)
          .attr('fill', d => getCountryFill(d))
          .attr('stroke', '#0d1b2e')
          .attr('stroke-width', 0.5)
          .attr('opacity', d => getLid(d) ? 1 : 0.35)
          .style('cursor', d => getLid(d) ? 'pointer' : 'default')
          .on('mouseover', function(event, d) {
            const lid = getLid(d);
            if (!lid) {
              d3.select(this).attr('opacity', 0.55).attr('fill', '#3a4a6c');
              return;
            }
            const land = LANDEN.find(l => l.id === lid);
            if (!land) return;
            if (aardState.selected !== lid) d3.select(this).attr('opacity', 0.72);
            if (tooltip) {
              let displayName = land.name;
              let displayCapital = land.capital;
              if (lid === 'FR') {
                try {
                  // Use bounding box west longitude to detect overseas territories
                  const bounds = d3.geoBounds(d);
                  const westLon = bounds[0][0]; // westernmost point
                  if (westLon < -20) {
                    displayName = 'Frans-Guyana 🇬🇫';
                    displayCapital = 'Cayenne';
                  } else if (westLon > 40) {
                    displayName = 'Frans overzees gebied 🇫🇷';
                    displayCapital = '(Indische Oceaan)';
                  }
                } catch(e) {}
              }
              tooltip.style.display = 'block';
              tooltip.innerHTML = `${land.flag} <strong>${displayName}</strong><br><span style="color:#9B93C4;font-weight:400;font-size:11px;">🏛️ ${displayCapital}</span>`;
            }
          })
          .on('mousemove', function(event) {
            if (!tooltip) return;
            const mapEl = document.getElementById('aard-map-container');
            if (!mapEl) return;
            const rect = mapEl.getBoundingClientRect();
            let x = event.clientX - rect.left + 12;
            let y = event.clientY - rect.top - 50;
            if (x + 170 > rect.width) x = rect.width - 175;
            if (y < 4) y = 4;
            tooltip.style.left = x + 'px';
            tooltip.style.top = y + 'px';
          })
          .on('mouseout', function(event, d) {
            const lid = getLid(d);
            d3.select(this)
              .attr('opacity', lid ? 1 : 0.35)
              .attr('fill', getCountryFill(d));
            if (tooltip) tooltip.style.display = 'none';
          })
          .on('click', function(event, d) {
            let lid = getLid(d);
            if (!lid) {
              const cardEl = document.getElementById('aard-country-card');
              if (cardEl) cardEl.innerHTML = '<p style="text-align:center;color:var(--tx3);font-size:13px;padding:12px;">📍 Dit land staat nog niet in onze lijst. Probeer een gekleurd land!</p>';
              return;
            }
            // For France overseas territories, show GUF instead
            if (lid === 'FR') {
              try {
                const bounds = d3.geoBounds(d);
                const westLon = bounds[0][0];
                if (westLon < -20) lid = 'GUF'; // Frans-Guyana
              } catch(e) {}
            }
            aardState.selected = lid;
            aardState.zoek = '';
            g.selectAll('path.country')
              .attr('fill', feat => getCountryFill(feat))
              .attr('opacity', feat => getLid(feat) ? 1 : 0.35);
            const land = LANDEN.find(l => l.id === lid);
            const cardEl = document.getElementById('aard-country-card');
            if (cardEl && land) cardEl.innerHTML = renderCountryCard(land, true);
          });

      // Country borders
      g.append('path')
        .datum(topojson.mesh(world, world.objects.countries, (a, b) => a !== b))
        .attr('fill', 'none')
        .attr('stroke', '#0a1525')
        .attr('stroke-width', 0.4)
        .attr('d', path);

      // Legenda
      const legItems = [
        {label:'Europa', col:'#7C6FFF'},{label:'Azië', col:'#06D6A0'},
        {label:'Afrika', col:'#FFD166'},{label:'N-Amerika', col:'#FF6B9D'},
        {label:'Z-Amerika', col:'#FF9F1C'},{label:'Oceanië', col:'#38BDF8'}
      ];
      const legG = svg.append('g').attr('transform',`translate(6,${H-22})`);
      legItems.forEach((item, i) => {
        const lx = i * (W/6);
        legG.append('rect').attr('x', lx).attr('y', 0).attr('width', 10).attr('height', 10).attr('rx', 2).attr('fill', item.col);
        legG.append('text').attr('x', lx+13).attr('y', 9).attr('fill','rgba(255,255,255,0.55)').attr('font-size', Math.max(8, W/90)).text(item.label);
      });
    })
    .catch(err => {
      const inner = document.getElementById('aard-map-inner');
      if (inner) inner.innerHTML = '<p style="color:#9B93C4;text-align:center;padding:30px;font-size:13px;">⚠️ Kaart kon niet laden.</p>';
    });
}

function selectLand(id) {
  aardState.selected = id;
  aardState.zoek = '';

  if (aardState.tab === 'kaart') {
    // Leeg het zoekveld
    const zoekEl = document.getElementById('aard-zoek');
    if (zoekEl) zoekEl.value = '';

    // Verberg zoekresultaten
    const zoekDiv = document.getElementById('aard-zoek-resultaten');
    if (zoekDiv) zoekDiv.innerHTML = '';

    // Toon kaart terug
    const mapHolder = document.getElementById('aard-map-wrap-holder');
    if (mapHolder) {
      mapHolder.style.display = '';
      if (!document.getElementById('aard-map-container')) {
        mapHolder.innerHTML = renderWorldMap();
        loadD3AndMap();
      }
    }

    // Update kaart kleuren
    if (_mapG) {
      _mapG.selectAll('path.country')
        .attr('fill', d => getCountryFill(d))
        .attr('opacity', d => getLid(d) ? 1 : 0.35);
    }

    // Toon landkaart
    const land = LANDEN.find(l => l.id === id);
    const cardEl = document.getElementById('aard-country-card');
    if (cardEl && land) cardEl.innerHTML = renderCountryCard(land, true);

  } else if (aardState.tab === 'lijst') {
    renderAardContent();
  }
}

function aardZoek(v) {
  aardState.zoek = v;
  aardState.selected = null;

  // Update alleen de resultaten — het input-veld wordt NIET aangeraakt zodat focus behouden blijft
  const zoekDiv = document.getElementById('aard-zoek-resultaten');
  const mapHolder = document.getElementById('aard-map-wrap-holder');
  const cardEl = document.getElementById('aard-country-card');

  if (zoekDiv) zoekDiv.innerHTML = v ? renderZoekResultatenHTML(v) : '';

  if (mapHolder) {
    if (v) {
      mapHolder.style.display = 'none'; // verberg kaart tijdens zoeken maar behoud D3-state
    } else {
      mapHolder.style.display = '';
      if (!document.getElementById('aard-map-container')) {
        mapHolder.innerHTML = renderWorldMap();
        loadD3AndMap();
      }
    }
  }

  if (cardEl) {
    cardEl.innerHTML = '<p style="text-align:center;color:var(--tx3);font-size:13px;margin-top:8px;">Klik op een land op de kaart of zoek hierboven 🌍</p>';
  }
}

function renderAardLijst(el) {
  el.innerHTML = `

    inp.addEventListener('input', function() {
      aardState.zoek = this.value;
      aardState.selected = null;
      document.getElementById('aard-lijst-card').innerHTML = '';
      renderAardLijstResults();
    });
  }
}

function renderAardLijstResults() {
  const q = aardState.zoek.toLowerCase();
  const filtered = LANDEN.filter(l => {
    const matchCont = aardState.cont === 'Alle' || l.cont.includes(aardState.cont);
    const matchQ = !q || l.name.toLowerCase().includes(q) || l.capital.toLowerCase().includes(q);
    return matchCont && matchQ;
  });
  const resultsEl = document.getElementById('aard-lijst-results');
  const countEl = document.getElementById('aard-lijst-count');
  if (resultsEl) resultsEl.innerHTML = `
    <div style="background:var(--surface2);border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--surface3);max-height:380px;overflow-y:auto;">
      ${filtered.map(l => `<div class="country-list-item" onclick="selectLand('${l.id}')">
        <span class="cli-flag">${l.flag}</span>
        <div style="flex:1"><div class="cli-name">${l.name}</div><div class="cli-cap">🏛️ ${l.capital} · ${l.cont}</div></div>
        <span style="font-size:11px;color:var(--tx3);">${l.pop}</span>
      </div>`).join('')}
      ${!filtered.length ? '<p style="text-align:center;color:var(--tx3);font-size:13px;padding:16px;">Geen landen gevonden</p>' : ''}
    </div>`;
  if (countEl) countEl.textContent = filtered.length + ' landen';
}

function aardZoekLijst(v) {
  aardState.zoek = v;
  aardState.selected = null;
  renderAardLijstResults();
}

function aardFilterCont(c) {
  aardState.cont = c;
  aardState.selected = null;
  // Update knop stijlen
  document.querySelectorAll('.aard-cont-btn').forEach(btn => btn.classList.toggle('on', btn.textContent === c));
  document.getElementById('aard-lijst-card').innerHTML = '';
  renderAardLijstResults();
}

function startAardQuiz() {
  // Toon keuzemenu
  aardState.quiz.mode = null;
  aardState.tab = 'quiz';
  renderAardPanel();
}

function startAardQuizMode(mode) {
  // mode: 'vlag' | 'hoofdstad' | 'kaart'
  aardState.quiz.mode = mode;
  const validLanden = LANDEN.filter(l => l.id !== 'ATA' && l.cont !== 'Antarctica');
  // Kaartmodus: enkel landen die groot genoeg zijn
  const kaartLanden = new Set(['US','CA','RU','CN','BR','AU','IN','AR','KZ','DZ','CD','SA','MX','ID','SD','LY','IR','MN','PE','NG','ET','EG','CO','ZA','TN','MA','FR','DE','GB','ES','TR','UA','PL','NO','SE','FI','IQ','AF','PK','VN','TH','MM','BO','VE','ZM','MZ','TZ','KE','AO','ZW','ML','NE','TD','MR','YE','OM','MY','PH','BY','RO','CZ','SK','HU','RS','BG','GR','FI','SE','PT','BE','NL','AT','CH','HRV','BA','MK','AL','MD','GE','AZ','AM','TJ','TM','KG','UZ','SY','LB','JO','IQ','KW','QA','OM','LK','NP','BD','KH','LA','MM','PH','MY','ID','VN','TH','CN','MN','KZ','UZ']);
  const pool = mode === 'kaart' ? validLanden.filter(l => kaartLanden.has(l.id)) : validLanden;
  const shuffled = [...pool].sort(() => Math.random() - 0.5).slice(0, 10);
  aardState.quiz.vragen = shuffled.map(l => ({ land: l }));
  aardState.quiz.cur = 0;
  aardState.quiz.score = 0;
  aardState.quiz.gekozen = null;
  renderAardContent();
}

function renderAardQuizContent(el) {
  // Keuzemenu als nog geen modus gekozen
  if (!aardState.quiz.mode) {
    el.innerHTML = `

        <div style="font-family:'Fredoka',sans-serif;font-size:22px;font-weight:700;color:var(--tx);margin-bottom:4px;">Kies een quizmodus</div>

          <span style="font-size:2.2rem;">🏛️</span>
          <div><div style="font-family:'Fredoka',sans-serif;font-size:18px;font-weight:700;color:var(--tx);">Land & Hoofdstad</div><div style="font-size:12px;color:var(--tx3);">Vlag + naam gegeven — raad de hoofdstad</div></div>

          <span style="font-size:2.2rem;">🗺️</span>
          <div><div style="font-family:'Fredoka',sans-serif;font-size:18px;font-weight:700;color:var(--tx);">Kaart herkennen</div><div style="font-size:12px;color:var(--tx3);">Een land licht op op de kaart — welk land is het?</div></div>
        </button>
      </div>
      <button onclick="aardTab('kaart')" style="display:block;margin:0 auto;padding:6px 16px;border-radius:20px;border:1px solid var(--surface3);background:none;color:var(--tx3);font-size:12px;cursor:pointer;">← Terug naar kaart</button>
    `;
    return;
  }

  if (aardState.quiz.cur >= aardState.quiz.vragen.length) {
    renderAardQuizEnd(el); return;
  }

  const { land: q } = aardState.quiz.vragen[aardState.quiz.cur];
  const mode = aardState.quiz.mode;
  const gekozen = aardState.quiz.gekozen;

  // Genereer opties
  const pool = LANDEN.filter(l => l.id !== 'ATA' && l.id !== q.id);
  const wrong = pool.sort(() => Math.random() - 0.5).slice(0, 3);
  const opts = [q, ...wrong].sort(() => Math.random() - 0.5);

  const modeLabel = {vlag:'🚩 Vlaggen', hoofdstad:'🏛️ Hoofdsteden', kaart:'🗺️ Kaart'}[mode];

  let vraagHTML = '';
  if (mode === 'vlag') {
    vraagHTML = `<div class="quiz-q-flag">${q.flag}</div><div class="quiz-q-text">Van welk land is dit de vlag?</div>`;
  } else if (mode === 'hoofdstad') {
    vraagHTML = `<div class="quiz-q-flag">${q.flag}</div><div class="quiz-q-text">Wat is de hoofdstad van <strong>${q.name}</strong>?</div>`;
  } else {
    vraagHTML = `<div class="quiz-q-text">Welk land is <span style="color:#FFD166;font-weight:700;">geel</span> gemarkeerd?</div><div id="quiz-mini-map" style="width:100%;height:170px;background:#0d1b2e;border-radius:12px;overflow:hidden;margin:8px 0;"></div>`;
  }

  const optsHTML = opts.map((o, i) => {
    const label = mode === 'hoofdstad' ? o.capital : o.name;
    const isCorrect = o.id === q.id;
    let cls = 'quiz-opt';
    if (gekozen !== null) cls += isCorrect ? ' correct' : (o.id === gekozen ? ' wrong' : '');
    return `<button class="${cls}" id="quiz-opt-${i}" data-id="${o.id}" onclick="aardQuizAntwoord('${o.id}')" ${gekozen!==null?'disabled':''}>${label}</button>`;
  }).join('');

  el.innerHTML = `
    <div class="quiz-score-bar">
      <span>Vraag ${aardState.quiz.cur+1} / ${aardState.quiz.vragen.length}</span>
      <span style="color:var(--accent2);font-size:11px;font-weight:700;">${modeLabel}</span>
      <span style="color:var(--ok);">✓ ${aardState.quiz.score}</span>
    </div>
    <div class="quiz-question-card">${vraagHTML}</div>
    <div class="quiz-opts" id="quiz-opts-grid">${optsHTML}</div>
    <div class="quiz-feedback" id="quiz-feedback">
      ${gekozen !== null ? (gekozen===q.id ? '✅ Goed zo!' : `❌ Juist: <strong style="color:var(--ok);">${mode==='hoofdstad'?q.capital:q.name}</strong>`) : ''}
    </div>
    <div class="quiz-next-wrap" id="quiz-next-wrap">
      ${gekozen !== null ? `
        ${renderCountryCard(q, false)}
        <button class="quiz-next-btn" onclick="aardQuizVolgende()">
          ${aardState.quiz.cur+1 < aardState.quiz.vragen.length ? 'Volgende vraag →' : '🏁 Resultaat bekijken'}
        </button>` : ''}
    </div>
    <button onclick="startAardQuiz()" style="display:block;margin:8px auto 0;padding:6px 16px;border-radius:20px;border:1px solid var(--surface3);background:none;color:var(--tx3);font-size:12px;cursor:pointer;">✕ Quiz stoppen</button>
  `;

  if (mode === 'kaart') renderQuizMiniMap(q.id);
}

let _worldDataCache = null;

function renderQuizMiniMap(highlightId) {
  const container = document.getElementById('quiz-mini-map');
  if (!container) return;
  if (!window.d3 || !window.topojson) {
    container.innerHTML = '<p style="color:#9B93C4;text-align:center;padding:20px;font-size:12px;">⏳ Kaart laden...</p>';
    const wait = setInterval(() => { if (window.d3 && window.topojson) { clearInterval(wait); renderQuizMiniMap(highlightId); } }, 200);
    return;
  }

  const drawMap = (world) => {
    container.innerHTML = '';
    const W = container.offsetWidth || 340;
    const H = 170;
    const svg = d3.select('#quiz-mini-map').append('svg').attr('width','100%').attr('height',H).attr('viewBox',`0 0 ${W} ${H}`);
    svg.append('rect').attr('width',W).attr('height',H).attr('fill','#0d1b2e');
    svg.append('defs').html(`
      <filter id="qglow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <style>@keyframes qpulse{0%{fill:#FFD166}50%{fill:#FF9F1C}100%{fill:#FFD166}}.qhl{animation:qpulse 1.4s ease-in-out infinite;}</style>
    `);
    const projection = d3.geoNaturalEarth1().scale(W/6.5).translate([W/2, H/2]);
    const path = d3.geoPath().projection(projection);
    const g = svg.append('g');
    const countries = topojson.feature(world, world.objects.countries);
    const targetFeature = countries.features.find(f => {
      const iso3 = getNumToIso3()[String(parseInt(f.id,10))];
      return iso3 ? ISO_TO_LEERHELD[iso3] === highlightId : false;
    });
    if (targetFeature) {
      const [[x0,y0],[x1,y1]] = path.bounds(targetFeature);
      const dx = x1-x0, dy = y1-y0;
      const scale = Math.min(7, Math.max(1.5, 0.65 / Math.max(dx/W, dy/H)));
      g.attr('transform', `translate(${W/2 - scale*(x0+x1)/2},${H/2 - scale*(y0+y1)/2}) scale(${scale})`);
    }
    g.selectAll('path').data(countries.features).enter().append('path')
      .attr('d', path)
      .attr('fill', f => { const iso3=getNumToIso3()[String(parseInt(f.id,10))]; return (iso3&&ISO_TO_LEERHELD[iso3]===highlightId)?'#FFD166':'#2a3a5c'; })
      .attr('stroke','#0a1525').attr('stroke-width',0.4)
      .attr('class', f => { const iso3=getNumToIso3()[String(parseInt(f.id,10))]; return (iso3&&ISO_TO_LEERHELD[iso3]===highlightId)?'qhl':''; })
      .attr('filter', f => { const iso3=getNumToIso3()[String(parseInt(f.id,10))]; return (iso3&&ISO_TO_LEERHELD[iso3]===highlightId)?'url(#qglow)':''; });
  };

  if (_worldDataCache) { drawMap(_worldDataCache); return; }
  container.innerHTML = '<p style="color:#9B93C4;text-align:center;padding:20px;font-size:12px;">⏳ Kaart laden...</p>';
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json')
    .then(r => r.json())
    .then(world => { _worldDataCache = world; drawMap(world); })
    .catch(() => { container.innerHTML = '<p style="color:#9B93C4;text-align:center;padding:20px;font-size:12px;">⚠️ Kaart kon niet laden.</p>'; });
}

function aardQuizAntwoord(id) {
  if (aardState.quiz.gekozen !== null) return;
  aardState.quiz.gekozen = id;
  const { land: q } = aardState.quiz.vragen[aardState.quiz.cur];
  const correct = id === q.id;
  if (correct) { aardState.quiz.score++; snd('ok'); } else { snd('no'); }

  const grid = document.getElementById('quiz-opts-grid');
  if (grid) grid.querySelectorAll('.quiz-opt').forEach(btn => {
    btn.disabled = true;
    if (btn.dataset.id === q.id) btn.classList.add('correct');
    else if (btn.dataset.id === id) btn.classList.add('wrong');
  });

  const mode = aardState.quiz.mode;
  const fb = document.getElementById('quiz-feedback');
  if (fb) fb.innerHTML = correct ? '✅ Goed zo!' : `❌ Juist: <strong style="color:var(--ok);">${mode==='hoofdstad'?q.capital:q.name}</strong>`;

  const wrap = document.getElementById('quiz-next-wrap');
  if (wrap) wrap.innerHTML = `
    ${renderCountryCard(q, false)}
    <button class="quiz-next-btn" onclick="aardQuizVolgende()">
      ${aardState.quiz.cur+1 < aardState.quiz.vragen.length ? 'Volgende vraag →' : '🏁 Resultaat bekijken'}
    </button>`;
}

function aardQuizVolgende() {
  aardState.quiz.cur++;
  aardState.quiz.gekozen = null;
  renderAardContent();
}


function renderAardQuizEnd(el) {
  const score = aardState.quiz.score;
  const total = aardState.quiz.vragen.length;
  const pct = Math.round(score / total * 100);
  const emoji = pct >= 80 ? '🏆' : pct >= 60 ? '⭐' : pct >= 40 ? '💪' : '📚';
  const msg = pct >= 80 ? 'Geweldig! Je bent een echte wereldkenner!' : pct >= 60 ? 'Goed gedaan! Nog een beetje oefenen!' : pct >= 40 ? 'Niet slecht! Blijf oefenen!' : 'Oefening baart kunst! Probeer opnieuw!';
  if (pct >= 80) boom();
  el.innerHTML = `
    <div class="aard-quiz-end">
      <div class="aard-quiz-end-emoji">${emoji}</div>
      <div class="aard-quiz-end-title">${score} / ${total} goed!</div>
      <div style="font-size:13px;color:var(--tx2);margin-bottom:16px;">${msg}</div>
      <div style="display:flex;gap:10px;justify-content:center;margin-bottom:16px;">
        <div style="background:var(--surface2);border-radius:var(--radius-sm);padding:12px 20px;text-align:center;">
          <div style="font-family:'Fredoka',sans-serif;font-size:2rem;font-weight:700;color:var(--accent);">${pct}%</div>
          <div style="font-size:11px;color:var(--tx3);text-transform:uppercase;">score</div>
        </div>
      </div>
      <button class="quiz-next-btn" onclick="startAardQuizMode('${aardState.quiz.mode}')" style="margin-bottom:8px;">🔄 Opnieuw spelen</button>
      <button onclick="startAardQuiz()" style="display:block;width:100%;padding:10px;border-radius:var(--radius-sm);border:1px solid var(--surface3);background:none;color:var(--tx2);font-size:14px;cursor:pointer;font-family:'Fredoka',sans-serif;margin-bottom:8px;">🎯 Andere modus</button>
      <button onclick="aardTab('kaart')" style="display:block;width:100%;padding:10px;border-radius:var(--radius-sm);border:1px solid var(--surface3);background:none;color:var(--tx3);font-size:14px;cursor:pointer;font-family:'Fredoka',sans-serif;">🗺️ Terug naar kaart</button>
    </div>`;
}

function changePw(){
  const oud=document.getElementById('pw-oud').value;
  const n1=document.getElementById('pw-nieuw1').value;
  const n2=document.getElementById('pw-nieuw2').value;
  const err=document.getElementById('pw-change-err');
  if(oud!==getStoredPw()){err.textContent='Huidig wachtwoord klopt niet.';return;}
  if(!n1||n1.length<3){err.textContent='Nieuw wachtwoord moet minstens 3 tekens zijn.';return;}
  if(n1!==n2){err.textContent='Nieuwe wachtwoorden komen niet overeen.';return;}
  setPw(n1);err.style.color='var(--ok)';err.textContent='✓ Wachtwoord gewijzigd!';
}
